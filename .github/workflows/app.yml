name: macOS app

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Script syntax (bash 3.2)
        run: /bin/bash --version | head -1 && /bin/bash -n macsweep

      - name: Engine modes (__scan / __exec)
        run: app/scripts/test-engine.sh

      - name: Unit tests
        working-directory: app
        run: swift test

      - name: Build MacSweep.app
        run: app/build-app.sh

      - name: Build MacSweep.dmg
        run: |
          python3 -m venv /tmp/dmgenv && /tmp/dmgenv/bin/pip install --quiet dmgbuild
          DMGBUILD=/tmp/dmgenv/bin/dmgbuild app/make-dmg.sh

      - name: Screenshots (demo data)
        continue-on-error: true
        run: app/scripts/screenshot.sh

      - name: TEMP screenshot to log
        continue-on-error: true
        run: |
          sips -s format jpeg -s formatOptions 60 --resampleWidth 900 app/build/screenshot-scanning.png --out /tmp/s.jpg >/dev/null
          echo "BEGIN-SHOT"; base64 -b 160 -i /tmp/s.jpg; echo "END-SHOT"

      - uses: actions/upload-artifact@v4
        with:
          name: MacSweep
          path: |
            app/build/MacSweep.dmg
            app/build/MacSweep.zip
            app/build/screenshot-*.png

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/MacSweep.dmg
            app/build/MacSweep.zip
          generate_release_notes: true

  # TEMP: prints the DMG in 400 KB base64 pieces, one job each, so it can be read from the logs.
  dmg-pieces:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacSweep
      - run: |
          f=$(find . -name MacSweep.dmg | head -1)
          echo "SIZE $(stat -c %s "$f") SHA $(sha256sum "$f" | cut -d' ' -f1)"
          echo "BEGIN-PART"; dd if="$f" bs=400000 skip=${{ matrix.part }} count=1 2>/dev/null | base64 -w 160; echo "END-PART"
