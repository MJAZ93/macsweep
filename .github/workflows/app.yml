name: macOS app

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Script syntax (bash 3.2)
        run: /bin/bash --version | head -1 && /bin/bash -n macsweep

      - name: Engine modes (__scan / __exec)
        run: app/scripts/test-engine.sh

      - name: Unit tests
        working-directory: app
        run: swift test

      - name: Build MacSweep.app
        run: app/build-app.sh

      - name: Build MacSweep.dmg
        run: |
          python3 -m venv /tmp/dmgenv && /tmp/dmgenv/bin/pip install --quiet dmgbuild
          DMGBUILD=/tmp/dmgenv/bin/dmgbuild app/make-dmg.sh

      - name: Screenshots (demo data)
        continue-on-error: true
        run: app/scripts/screenshot.sh

      - name: TEMP dmg to log
        run: |
          shasum -a 256 app/build/MacSweep.dmg
          echo "BEGIN-DMG"; base64 -b 160 -i app/build/MacSweep.dmg; echo "END-DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: MacSweep
          path: |
            app/build/MacSweep.dmg
            app/build/MacSweep.zip
            app/build/screenshot-*.png

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/MacSweep.dmg
            app/build/MacSweep.zip
          generate_release_notes: true
