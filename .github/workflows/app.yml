name: macOS app

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Script syntax (bash 3.2)
        run: /bin/bash --version | head -1 && /bin/bash -n macsweep

      - name: Engine modes (__scan / __exec)
        run: app/scripts/test-engine.sh

      - name: Unit tests
        working-directory: app
        run: swift test

      - name: Build MacSweep.app
        run: app/build-app.sh

      - name: Screenshots (demo data)
        continue-on-error: true
        run: app/scripts/screenshot.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MacSweep
          path: |
            app/build/MacSweep.zip
            app/build/screenshot-*.png

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/MacSweep.zip
